name: Update site from OneDrive Excel

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - name: Download the Excel from OneDrive
        env:
          EXCEL_URL: ${{ secrets.EXCEL_URL }}
        run: |
          test -n "$EXCEL_URL" || { echo "Secret EXCEL_URL is missing"; exit 1; }
          # accept a plain link or the whole <iframe ...> embed code
          SRC=$(printf '%s' "$EXCEL_URL" | grep -o 'src="[^"]*"' | head -1 | sed 's/^src="//; s/"$//; s/&amp;/\&/g')
          [ -n "$SRC" ] && EXCEL_URL="$SRC"
          EXCEL_URL=$(printf '%s' "$EXCEL_URL" | tr -d '[:space:]')
          DL=$(printf '%s' "$EXCEL_URL" | sed 's#/embed?#/download?#')
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
          try() { rm -f T-Report.xlsx; curl -sSL -A "$UA" -o T-Report.xlsx -w "http=%{http_code} " "$1" || true; head -c 2 T-Report.xlsx 2>/dev/null | grep -q PK; }
          ENC=$(printf '%s' "$EXCEL_URL" | base64 -w0 | tr '/+' '_-' | tr -d '=')
          FINAL=$(curl -sSL -A "$UA" -o /dev/null -w '%{url_effective}' "$EXCEL_URL" || true)
          case "$EXCEL_URL" in *\?*) SEP='&';; *) SEP='?';; esac
          case "$FINAL" in *\?*) SEP2='&';; *) SEP2='?';; esac
          echo "link host: $(echo "$EXCEL_URL" | cut -d/ -f3) -> $(echo "$FINAL" | cut -d/ -f3)"
          try "$DL" \
            || try "https://api.onedrive.com/v1.0/shares/u!${ENC}/root/content" \
            || try "${EXCEL_URL}${SEP}download=1" \
            || try "${FINAL}${SEP2}download=1" \
            || { echo; echo "All download methods failed"; exit 1; }
          echo "download ok"
      - name: Build data.js
        run: python build_data.py T-Report.xlsx
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html style.css app.js data.js _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
